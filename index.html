<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0f15" />
    <meta
      name="description"
      content="City of Small Chances — a grounded urban life game. Walk the Old Harbour: work, rest, connect, and choose what kind of life is worth protecting."
    />
    <title>City of Small Chances</title>

    <!-- Social-preview card (Batch 36, ui-023): the painted Old Harbour cover so a
         shared link renders the game's storefront art. Absolute URLs for scrapers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="City of Small Chances" />
    <meta property="og:title" content="City of Small Chances" />
    <meta
      property="og:description"
      content="A grounded urban life game. Walk the Old Harbour: work, rest, connect, and choose what kind of life is worth protecting."
    />
    <meta property="og:url" content="https://mon-ius.github.io/City-of-Small-Chances/" />
    <meta property="og:image" content="https://mon-ius.github.io/City-of-Small-Chances/assets/ui/store/STORE_Capsule_Header.png" />
    <meta property="og:image:width" content="920" />
    <meta property="og:image:height" content="430" />
    <meta property="og:image:alt" content="The Old Harbour at golden hour — a lighthouse, moored boats and a lamplit quay catching the warm light." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="City of Small Chances" />
    <meta name="twitter:description" content="A grounded urban life game. Walk the Old Harbour." />
    <meta name="twitter:image" content="https://mon-ius.github.io/City-of-Small-Chances/assets/ui/store/STORE_Capsule_Header.png" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f15'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%8F%99%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles/game.css" />

    <!-- Vanilla ES modules + a local, vendored Three.js. No build step, no bundler.
         The relative path keeps it working at the GitHub Pages project sub-path. -->
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Fixed overlay HUD. pointer-events:none so it never eats world input; never scrolls. -->
    <div id="hud" aria-hidden="true">
      <div class="hud__title">City of Small Chances</div>
      <div class="hud__clock" id="clock">Day 1 · 06:00 · Morning</div>
      <div class="hud__hint">WASD / Arrows to walk · drag to look · [E] to use · [1–5] to pick</div>
    </div>

    <div id="boot">
      <div class="boot__title">City of Small Chances</div>
      <div class="boot__sub">waking the harbour…</div>
    </div>

    <noscript>
      <p style="color:#fff;padding:2rem;font-family:sans-serif">
        City of Small Chances needs JavaScript and WebGL to run.
      </p>
    </noscript>

    <script type="module" src="./src/three/main.js"></script>
  </body>
</html>
